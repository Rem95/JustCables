<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustCables Enterprise CRM</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurația ta oficială Firebase completă
        const firebaseConfig = {
            apiKey: "AIzaSyDbJLNxlA_PuCgBLZzdQaLN8NLilHwpPtM",
            authDomain: "justcables-d4282.firebaseapp.com",
            databaseURL: "https://justcables-d4282-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "justcables-d4282",
            storageBucket: "justcables-d4282.firebasestorage.app",
            messagingSenderId: "517016256204",
            appId: "1:517016256204:web:3976befa1b81a753104c69",
            measurementId: "G-H2SCM11XFW"
        };

        // Inițializare servicii Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Mapare pe obiectul window pentru apelare directă din HTML (onclick)
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.handleLogout = handleLogout;
        window.saveDataOnline = saveDataOnline;
        window.loadManagerVault = loadManagerVault;

        let currentUserData = null;

        // Monitorizare sesiune User (Logat / Delocat)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    currentUserData = docSnap.data();
                    currentUserData.uid = user.uid;
                    
                    // Schimbă titlul dashboard-ului cu numele companiei sale
                    document.getElementById('companyDashboardTitle').innerText = currentUserData.companyName.toUpperCase();
                    
                    showDashboard();
                    applyPermissions();
                }
            } else {
                currentUserData = null;
                document.querySelectorAll('.app-container').forEach(c => c.classList.add('hidden'));
                document.getElementById('loginSection').classList.remove('hidden');
            }
        });

        // Autentificare cont existent
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const errDiv = document.getElementById('loginError');
            errDiv.style.display = "none";

            if (!email || !pass) return alert("Please fill in all fields!");

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                errDiv.innerText = "Error: " + error.message;
                errDiv.style.display = "block";
            }
        }

        // Creare cont nou (Înregistrare tip Facebook)
        async function handleRegister() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            const compName = document.getElementById('regCompanyName').value;
            const regErr = document.getElementById('regError');
            regErr.style.display = "none";

            if(!email || !pass || !compName) return alert("All fields are required!");

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // Alocare automată rol de Manager pentru conturile tale principale
                let role = "client";
                if(email.toLowerCase() === "justcables@outlook.com" || email.toLowerCase() === "ivascaremus@gmail.com") {
                    role = "manager";
                }

                // Salvare profil companie în Cloud Firestore
                await setDoc(doc(db, "users", user.uid), {
                    email: email,
                    companyName: compName,
                    role: role,
                    createdAt: new Date().toISOString()
                });

                alert("Account created successfully!");
                toggleAuthScreens();
            } catch (error) {
                regErr.innerText = "Registration Error: " + error.message;
                regErr.style.display = "block";
            }
        }

        // Delogare
        async function handleLogout() {
            await signOut(auth);
            location.reload();
        }

        // Drepturi de vizualizare (Manager vs Utilizator normal)
        function applyPermissions() {
            const managerSection = document.getElementById('managerSection');
            
            if (currentUserData && currentUserData.role === 'manager') {
                document.getElementById('companyDashboardTitle').innerText = "JUSTCABLES CRM (MANAGER)";
                if (managerSection) managerSection.style.removeProperty('display');
            } else {
                if (managerSection) managerSection.style.display = 'none';
            }
        }

        // Salvare raport direct în Cloud Database
        async function saveDataOnline() {
            const biz = document.getElementById('bizName').value;
            const mail = document.getElementById('clientMail').value;
            const type = document.getElementById('formTitle').innerText;

            if(!biz || !mail) return alert("Business Name and Email are required!");

            const dataReport = {
                uid: currentUserData.uid,
                createdByCompany: currentUserData.companyName,
                biz: biz,
                mail: mail,
                phone: document.getElementById('phone').value,
                contact: document.getElementById('contactName').value,
                status: document.getElementById('workStatus').value,
                price: document.getElementById('totalPrice').value,
                notes: document.getElementById('notes').value,
                date: new Date().toLocaleString(),
                type: type,
                sig: document.getElementById('sig-canvas').toDataURL()
            };

            try {
                await addDoc(collection(db, "reports"), dataReport);
                alert("Report synced directly to Cloud Server!");
                generatePDF(dataReport);
                showDashboard();
            } catch (e) {
                alert("Sync failed: " + e.message);
            }
        }

        // Panou Centralizat de Control Manager (Tu vezi tot de la toți clienții)
        async function loadManagerVault() {
            if(currentUserData.role !== 'manager') return alert("Access denied!");
            
            const listDiv = document.getElementById('managerVaultList');
            listDiv.innerHTML = "Fetching global records from secure server...";

            try {
                const querySnapshot = await getDocs(collection(db, "reports"));
                listDiv.innerHTML = "";
                
                if (querySnapshot.empty) {
                    listDiv.innerHTML = "<p style='text-align:center; color:#888;'>No records discovered in cloud network.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const r = doc.data();
                    const card = document.createElement('div');
                    card.className = 'record-card';
                    card.innerHTML = `
                        <h4>${r.biz}</h4>
                        <p><strong>CREATOR COMPANY:</strong> ${r.createdByCompany.toUpperCase()}</p>
                        <p><strong>Contact:</strong> ${r.contact || 'N/A'} | <strong>Phone:</strong> ${r.phone || 'N/A'}</p>
                        <p><strong>Email:</strong> ${r.mail} | <strong>Date:</strong> ${r.date}</p>
                        <p><strong>Total Amount:</strong> €${r.price || '0'} [${r.status}]</p>
                        <p style="font-size: 0.75rem; color: #ccc; margin-top: 5px; background: rgba(0,0,0,0.2); padding: 5px; border-radius:4px;"><strong>Notes:</strong> ${r.notes}</p>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (err) {
                listDiv.innerHTML = "Download failure: " + err.message;
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
    
    <style>
        :root { --jc-yellow: #ecc94b; --jc-blue: #0056b3; --dark-overlay: rgba(13, 20, 31, 0.9); }
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: white; background-color: #000; overflow-x: hidden; }
        #bgVideo { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; opacity: 0.5; }
        .app-container { max-width: 600px; margin: 30px auto; padding: 25px; background: var(--dark-overlay); border-radius: 15px; border: 1px solid var(--jc-yellow); backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); }
        .hidden { display: none !important; }
        label { font-size: 0.75rem; color: var(--jc-yellow); margin-top: 12px; display: block; font-weight: bold; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: none; background: rgba(255, 255, 255, 0.9); color: #222; box-sizing: border-box; font-weight: 600; }
        button { width: 100%; padding: 14px; margin-top: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-main { background-color: var(--jc-yellow); color: #000; letter-spacing: 1px; }
        .record-card { background: rgba(255,255,255,0.06); padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 5px solid var(--jc-yellow); text-align: left; }
        .record-card h4 { margin: 0 0 5px 0; color: var(--jc-yellow); font-size: 1rem; }
        .record-card p { margin: 3px 0; font-size: 0.8rem; color: #ddd; }
        canvas { background: white; border-radius: 8px; margin-top: 10px; width: 100%; height: 150px; touch-action: none; }
        footer { text-align: center; margin-top: 40px; padding: 20px; background: rgba(0,0,0,0.8); border-top: 1px solid var(--jc-yellow); font-size: 12px; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bgVideo">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div id="loginSection" class="app-container">
        <img src="icon.png" style="width: 100px; display: block; margin: 0 auto 10px;">
        <h2 style="text-align:center; color:var(--jc-yellow); letter-spacing: 2px;">SECURE ACCESS</h2>
        
        <div id="authLoginFields">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="manager@company.com">
            
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
            
            <button class="btn-main" onclick="handleLogin()">Sign In</button>
            <p style="text-align:center; font-size:0.8rem; margin-top:15px; cursor:pointer; color:var(--jc-yellow);" onclick="toggleAuthScreens()">Don't have an account? Register here</p>
            <div id="loginError" style="color:#ff4d4d; text-align:center; margin-top:10px; display:none; font-weight:bold;"></div>
        </div>

        <div id="authRegisterFields" class="hidden">
            <h3 style="text-align: center; color: var(--jc-yellow); font-size:1rem;">CREATE BUSINESS CONTAINER</h3>
            
            <label>Company/Personal Display Name *</label>
            <input type="text" id="regCompanyName" placeholder="e.g. JustCables.ie ">

            <label>Email Address *</label>
            <input type="email" id="regEmail" placeholder="yourname@domain.com">
            
            <label>Password *</label>
            <input type="password" id="regPassword" placeholder="Minimum 6 characters">
            
            <button class="btn-main" style="background-color: #28a745; color: white;" onclick="handleRegister()">Create Account</button>
            <p style="text-align:center; font-size:0.8rem; margin-top:15px; cursor:pointer; color: #fff;" onclick="toggleAuthScreens()">Cancel and go back</p>
            <div id="regError" style="color:#ff4d4d; text-align:center; margin-top:10px; display:none; font-weight:bold;"></div>
        </div>
    </div>

    <div id="dashboardSection" class="app-container hidden">
        <h1 id="companyDashboardTitle" style="text-align:center; color:var(--jc-yellow);">JUSTCABLES</h1>
        
        <button class="btn-main" onclick="openForm('Site Survey')">New Site Survey</button>
        <button class="btn-main" onclick="openForm('Job Sheet')">New Job Sheet</button>
        <button class="btn-main" onclick="openForm('Maintenance')">New Maintenance</button>
        
        <div id="managerSection" style="display:none; margin-top:20px; border-top:1px dashed var(--jc-yellow); padding-top:15px;">
            <h3 style="color:var(--jc-yellow); text-align:center; font-size:0.9rem;">🛡️ APP MANAGER HUB</h3>
            <button style="background:#0056b3; color:white;" onclick="showVault()">Open Global Records Vault</button>
        </div>

        <button style="background:transparent; color:white; border:1px solid #666; margin-top:20px;" onclick="handleLogout()">Logout</button>
    </div>

    <div id="formSection" class="app-container hidden">
        <h2 id="formTitle" style="text-align:center; color:var(--jc-yellow);">FORM</h2>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label>Business Name *</label><input type="text" id="bizName"></div>
            <div><label>Client Email *</label><input type="email" id="clientMail"></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label>Contact Person</label><input type="text" id="contactName"></div>
            <div><label>Phone Number</label><input type="tel" id="phone"></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <label>Work Status</label>
                <select id="workStatus">
                    <option value="Ongoing">Ongoing</option>
                    <option value="Complete">Complete</option>
                </select>
            </div>
            <div><label>Final Price (€)</label><input type="number" id="totalPrice"></div>
        </div>
        
        <label>Technical Notes</label>
        <textarea id="notes" rows="4"></textarea>
        
        <label>Customer Signature</label>
        <canvas id="sig-canvas"></canvas>
        <button type="button" style="background:#333; color:var(--jc-yellow); font-size:0.7rem; padding:8px; margin-top:5px; border:1px solid var(--jc-yellow);" onclick="clearSignature()">Clear Signature</button>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <button class="btn-main" onclick="saveDataOnline()">Save & Cloud Sync</button>
            <button style="background:transparent; border:1px solid white; color:white;" onclick="showDashboard()">Back</button>
        </div>
    </div>

    <div id="vaultSection" class="app-container hidden">
        <h2 style="text-align:center; color:var(--jc-yellow); margin-bottom:15px;">Central Database Node</h2>
        <div id="managerVaultList" style="max-height: 400px; overflow-y: auto; margin-bottom:15px; padding-right:5px;"></div>
        <button class="btn-main" onclick="showDashboard()">Back to Dashboard</button>
    </div>

    <footer>
        <p>System Powered by <strong>JustCables Cloud Enterprise</strong></p>
    </footer>

    <script>
        let canvas, ctx, drawing = false;

        function toggleAuthScreens() {
            document.getElementById('authLoginFields').classList.toggle('hidden');
            document.getElementById('authRegisterFields').classList.toggle('hidden');
        }

        function showDashboard() {
            document.querySelectorAll('.app-container').forEach(c => c.classList.add('hidden'));
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        function openForm(t) {
            document.querySelectorAll('.app-container').forEach(c => c.classList.add('hidden'));
            document.getElementById('formSection').classList.remove('hidden');
            document.getElementById('formTitle').innerText = t;
            
            document.getElementById('bizName').value = '';
            document.getElementById('clientMail').value = '';
            document.getElementById('contactName').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('totalPrice').value = '';
            document.getElementById('notes').value = '';
            
            initCanvas();
        }

        function showVault() {
            document.querySelectorAll('.app-container').forEach(c => c.classList.add('hidden'));
            document.getElementById('vaultSection').classList.remove('hidden');
            loadManagerVault();
        }

        function initCanvas() {
            canvas = document.getElementById('sig-canvas'); ctx = canvas.getContext('2d');
            ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
            const getP = (e) => {
                const r = canvas.getBoundingClientRect();
                return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top };
            };
            canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); const p = getP(e); ctx.moveTo(p.x, p.y); };
            canvas.onmousemove = (e) => { if(drawing) { const p = getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } };
            window.onmouseup = () => drawing = false;
            canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); const p = getP(e); ctx.moveTo(p.x, p.y); e.preventDefault(); };
            canvas.ontouchmove = (e) => { if(drawing) { const p = getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); } };
        }

        function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // GENERARE PDF CU COMPANIE CREATOARE METADATA DINAMICĂ
        function generatePDF(d) {
            const doc = new jspdf.jsPDF();
            const pageHeight = doc.internal.pageSize.height;
            let yCursor = 55;

            doc.setFillColor(27, 46, 75); 
            doc.rect(0, 0, 210, yCursor, 'F');

            let activeCompanyTitle = d.createdByCompany ? d.createdByCompany.toUpperCase() : "JUSTCABLES";
            
            doc.setTextColor(236, 201, 75); 
            doc.setFontSize(22);
            doc.text(activeCompanyTitle, 20, 32);
            doc.setFontSize(10);
            doc.text("Professional Structured Infrastructure Report", 20, 41);

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            yCursor += 15;
            doc.text(`${d.type.toUpperCase()}`, 20, yCursor);

            doc.setFontSize(11);
            yCursor += 15;
            doc.text(`BUSINESS SITE: ${d.biz}`, 20, yCursor);
            doc.text(`DATE: ${d.date}`, 130, yCursor);

            yCursor += 15;
            doc.setFontSize(12);
            doc.text("TECHNICAL NOTES:", 20, yCursor);
            
            doc.setFontSize(10);
            yCursor += 10;
            const splitNotes = doc.splitTextToSize(d.notes || "No notes.", 170);
            splitNotes.forEach((line) => {
                if (yCursor + 7 > pageHeight - 25) { doc.addPage(); yCursor = 25; }
                doc.text(line, 20, yCursor);
                yCursor += 6;
            });

            yCursor += 10;
            doc.setFontSize(14);
            doc.text(`TOTAL PROJECT VALUATION: €${d.price}`, 20, yCursor);

            if(d.sig) {
                yCursor += 15;
                if (yCursor + 25 > pageHeight - 25) { doc.addPage(); yCursor = 25; }
                doc.setFontSize(10);
                doc.text("Customer Signature Authorization:", 20, yCursor);
                doc.addImage(d.sig, 'PNG', 20, yCursor + 5, 50, 20);
            }

            doc.save(`${d.biz}_InfrastructureReport.pdf`);
        }
    </script>
</body>
</html>
