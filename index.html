<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustCables Enterprise CRM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --jc-blue: #0056b3; --main-blue: #5DA9E1; --dark-bg: #1B2E4B; --input-bg: #f4f4f4; --error-red: #ff4d4d; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .app-container { max-width: 600px; margin: 20px auto; padding: 25px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        img.logo { width: 100%; border-radius: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--jc-blue); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        label { font-size: 0.75rem; color: var(--main-blue); margin-top: 8px; display: block; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: none; background: var(--input-bg); color: #333; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-main { background-color: var(--jc-blue); color: white; }
        .tab-btn { flex: 1; padding: 8px; text-align: center; background: rgba(255,255,255,0.1); cursor: pointer; border-radius: 5px; font-size: 0.65rem; font-weight: bold; }
        .tab-btn.active { background: var(--jc-blue); color: white; border: 1px solid white; }
        .folder-tabs { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
        .folder-btn { padding: 6px 10px; font-size: 0.6rem; border-radius: 4px; background: rgba(255,255,255,0.05); cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .folder-btn.active { background: #555; border-color: white; }
        .record-card { background: rgba(255,255,255,0.08); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--main-blue); cursor: pointer; position: relative; }
        .download-icon { color: var(--main-blue); font-size: 0.7rem; text-decoration: underline; display: block; margin-top: 5px; }
        .signature-pad { background: white; border-radius: 5px; margin-top: 8px; height: 120px; width: 100%; touch-action: none; border: 1px solid #ccc; }
        .error-msg { color: var(--error-red); font-size: 0.8rem; margin-top: 10px; text-align: center; font-weight: bold; display: none; }
        .checkbox-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 0.85rem; color: #ccc; cursor: pointer; }
        .checkbox-container input { width: auto; margin: 0; }
    </style>
</head>
<body>

    <div id="loginSection" class="app-container">
        <img src="justcablesimage.jpeg" class="logo">
        <h2 style="text-align:center; color:var(--main-blue);">System Access</h2>
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter Username">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password">
        
        <label class="checkbox-container">
            <input type="checkbox" onclick="togglePasswordVisibility()"> Show Password
        </label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="rememberMe"> Remember Me
        </label>

        <div id="loginError" class="error-msg">Invalid Username or Password. Please try again.</div>
        
        <button class="btn-main" onclick="checkLogin()">Login</button>
    </div>

    <div id="dashboardSection" class="app-container hidden">
        <img src="justcablesimage.jpeg" class="logo">
        <button class="btn-main" onclick="openForm('Site Survey')">New Site Survey</button>
        <button class="btn-main" onclick="openForm('Job Sheet')">New Job Sheet</button>
        <button class="btn-main" onclick="openForm('Maintenance')">New Maintenance</button>
        <button style="background:#6c757d; color:white;" onclick="showVault()">Records Vault</button>
        <button style="background:transparent; color:white; border:1px solid #ff4d4d; margin-top:20px; opacity:0.7;" onclick="logout()">Logout</button>
    </div>

    <div id="formSection" class="app-container hidden">
        <h2 id="formTitle" style="text-align:center; color:var(--main-blue);">Form</h2>
        <div class="grid-2">
            <div><label>Business Name *</label><input type="text" id="bizName"></div>
            <div><label>Client Email *</label><input type="email" id="clientMail"></div>
        </div>
        <div class="grid-2">
            <div><label>Phone Number *</label><input type="tel" id="phone" placeholder="00353..."></div>
            <div><label>Work Status</label>
                <select id="workStatus">
                    <option value="Ongoing">Ongoing</option>
                    <option value="Complete">Complete</option>
                    <option value="Inactive">Inactive</option>
                    <option value="Deleted">Deleted</option>
                </select>
            </div>
        </div>
        <div class="grid-2">
            <div><label>Contact Person</label><input type="text" id="contact"></div>
            <div><label>2nd Engineer?</label><select id="eng2"><option>NO</option><option>YES</option></select></div>
        </div>
        <div class="grid-2">
            <div><label>Base Price (€)</label><input type="number" id="basePrice"></div>
            <div><label>Extra Price (€)</label><input type="number" id="extraPrice"></div>
        </div>
        <div class="grid-2">
            <div><label>Final Total (€)</label><input type="number" id="finalTotal"></div>
            <div><label>Duration (h)</label><input type="number" id="duration"></div>
        </div>
        <label>Technical Notes</label>
        <textarea id="notes" rows="3"></textarea>
        <label>Photos (Max 10)</label>
        <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(event)">
        <label>Customer Signature</label>
        <canvas id="sig-canvas" class="signature-pad"></canvas>
        <button class="btn-main" onclick="saveAndProcess()">SAVE & EXPORT PDF</button>
        <button style="background:transparent; color:white; border:1px solid white;" onclick="location.reload()">Cancel</button>
    </div>

    <div id="vaultSection" class="app-container hidden">
        <h2 style="text-align:center;">Records Vault</h2>
        <input type="text" id="vaultSearch" placeholder="Search business..." onkeyup="renderVault()" style="margin-bottom:10px;">
        <div style="display:flex; gap:5px;">
            <div id="tabSurvey" class="tab-btn active" onclick="switchVault('Site Survey')">Surveys</div>
            <div id="tabJob" class="tab-btn" onclick="switchVault('Job Sheet')">Job Sheets</div>
            <div id="tabMaint" class="tab-btn" onclick="switchVault('Maintenance')">Maint</div>
        </div>
        <div class="folder-tabs">
            <div id="fOngoing" class="folder-btn active" onclick="switchFolder('Ongoing')">Ongoing</div>
            <div id="fComplete" class="folder-btn" onclick="switchFolder('Complete')">Complete</div>
            <div id="fInactive" class="folder-btn" onclick="switchFolder('Inactive')">Inactive</div>
            <div id="fDeleted" class="folder-btn" onclick="switchFolder('Deleted')" style="color:#ff4d4d;">Deleted</div>
        </div>
        <div id="recordsList" style="margin-top:15px;"></div>
        <button class="btn-main" onclick="showDashboard()">Back</button>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const DB_KEY = 'justcables_enterprise_final_v17';
        let canvas, ctx, drawing = false, photos = [], activeTab = 'Site Survey', activeFolder = 'Ongoing';

        window.onload = function() {
            if(localStorage.getItem('jc_remember') === 'active') showDashboard();
            initCanvas();
        };

        function togglePasswordVisibility() {
            const passField = document.getElementById("password");
            passField.type = passField.type === "password" ? "text" : "password";
        }

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            if(user === "JustCables" && pass === "JustC@bles!") {
                errorDiv.style.display = "none";
                if(document.getElementById('rememberMe').checked) {
                    localStorage.setItem('jc_remember', 'active');
                }
                showDashboard();
            } else {
                errorDiv.style.display = "block";
            }
        }

        function logout() {
            localStorage.removeItem('jc_remember');
            location.reload();
        }

        function showDashboard() {
            document.querySelectorAll('.app-container').forEach(d=>d.classList.add('hidden'));
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        function openForm(t) {
            document.querySelectorAll('.app-container').forEach(d=>d.classList.add('hidden'));
            document.getElementById('formSection').classList.remove('hidden');
            document.getElementById('formTitle').innerText = t;
            initCanvas();
        }

        function initCanvas() {
            canvas = document.getElementById('sig-canvas'); ctx = canvas.getContext('2d');
            const getP = (e) => { 
                const r = canvas.getBoundingClientRect(); 
                return { 
                    x: (e.clientX || (e.touches && e.touches[0].clientX)) - r.left, 
                    y: (e.clientY || (e.touches && e.touches[0].clientY)) - r.top 
                }; 
            };
            canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); const p = getP(e); ctx.moveTo(p.x, p.y); };
            canvas.onmousemove = (e) => { if(drawing) { const p = getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } };
            window.onmouseup = () => drawing = false;
            canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); const p = getP(e); ctx.moveTo(p.x, p.y); e.preventDefault(); };
            canvas.ontouchmove = (e) => { if(drawing) { const p = getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); } };
        }

        function handlePhotos(e) {
            photos = []; Array.from(e.target.files).slice(0, 10).forEach(file => {
                const r = new FileReader(); r.onload = (ev) => photos.push(ev.target.result); r.readAsDataURL(file);
            });
        }

        function saveAndProcess() {
            const biz = document.getElementById('bizName').value, mail = document.getElementById('clientMail').value;
            if(!biz || !mail) return alert("Business and Email required!");

            const data = {
                id: Date.now(), type: document.getElementById('formTitle').innerText, biz: biz, mail: mail,
                phone: document.getElementById('phone').value, status: document.getElementById('workStatus').value,
                base: document.getElementById('basePrice').value, extra: document.getElementById('extraPrice').value,
                total: document.getElementById('finalTotal').value, date: new Date().toLocaleDateString(), 
                notes: document.getElementById('notes').value, sig: canvas.toDataURL()
            };

            let db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
            db.push(data); localStorage.setItem(DB_KEY, JSON.stringify(db));
            
            generatePDF(data);
            window.location.href = `mailto:${mail}?subject=${data.type} - ${biz}&body=Report attached.`;
            showVault();
        }

        function generatePDF(d) {
            const doc = new jsPDF();
            doc.setFillColor(0, 86, 179); doc.rect(0,0,210,40,'F');
            doc.setFontSize(22); doc.setTextColor(255); doc.text("JustCables", 20, 20);
            doc.setFontSize(10); doc.text("Infrastructure & Cable Expert", 20, 28);
            doc.setTextColor(0); doc.text(`BUSINESS: ${d.biz}`, 20, 55);
            doc.text(`DATE: ${d.date} | TOTAL: €${d.total} | STATUS: ${d.status}`, 20, 62);
            doc.text("NOTES:", 20, 80); doc.text(d.notes || "N/A", 20, 85, {maxWidth:170});
            if(d.sig) doc.addImage(d.sig, 'PNG', 20, 260, 40, 15);
            doc.save(`${d.type}_${d.biz}.pdf`);
        }

        function showVault() { document.querySelectorAll('.app-container').forEach(d=>d.classList.add('hidden')); document.getElementById('vaultSection').classList.remove('hidden'); renderVault(); }
        function switchVault(t) { activeTab = t; renderVault(); }
        function switchFolder(f) { activeFolder = f; renderVault(); }

        function renderVault() {
            const query = document.getElementById('vaultSearch').value.toLowerCase();
            const list = document.getElementById('recordsList');
            let db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");

            document.querySelectorAll('.tab-btn, .folder-btn').forEach(b => b.classList.remove('active'));
            if(activeTab === 'Site Survey') document.getElementById('tabSurvey').classList.add('active');
            if(activeTab === 'Job Sheet') document.getElementById('tabJob').classList.add('active');
            if(activeTab === 'Maintenance') document.getElementById('tabMaint').classList.add('active');
            document.getElementById('f'+activeFolder).classList.add('active');

            let filtered = db.filter(r => r.type === activeTab && r.status === activeFolder && r.biz.toLowerCase().includes(query)).reverse();
            list.innerHTML = filtered.map(r => `
                <div class="record-card">
                    <strong>${r.biz}</strong><br><small>${r.date} | €${r.total}</small>
                    <span class="download-icon" onclick="reDownload('${r.id}')">Redownload PDF</span>
                    <button style="margin-top:5px; padding:5px; font-size:0.6rem; background:var(--main-blue);" onclick="changeStatus('${r.id}')">Change Status</button>
                </div>
            `).join('') || "<p style='text-align:center; opacity:0.5;'>Empty folder.</p>";
        }

        function changeStatus(id) {
            let db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
            let rec = db.find(r => r.id == id);
            let newStatus = prompt("Enter new status (Ongoing, Complete, Inactive, Deleted):", rec.status);
            if(newStatus && ["Ongoing", "Complete", "Inactive", "Deleted"].includes(newStatus)) {
                rec.status = newStatus;
                localStorage.setItem(DB_KEY, JSON.stringify(db));
                renderVault();
            } else { alert("Invalid status."); }
        }

        function reDownload(id) {
            let db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
            let rec = db.find(r => r.id == id);
            if(rec) generatePDF(rec);
        }
    </script>
</body>
</html>
